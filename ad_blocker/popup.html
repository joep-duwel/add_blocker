<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 230px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e2e8f0;
    }

    .header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2d2d4e;
    }

    .shield { width: 22px; height: 22px; }

    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      flex: 1;
    }

    .body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Status row */
    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef444488; }

    /* Counter card */
    .counter-card {
      background: #16213e;
      border: 1px solid #2d2d4e;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .counter-left { display: flex; flex-direction: column; gap: 2px; }

    .counter-number {
      font-size: 24px;
      font-weight: 700;
      color: #a78bfa;
      line-height: 1;
    }

    .counter-label {
      font-size: 11px;
      color: #64748b;
    }

    .reset-btn {
      background: none;
      border: 1px solid #2d2d4e;
      border-radius: 6px;
      color: #64748b;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .reset-btn:hover { border-color: #a78bfa; color: #a78bfa; }

    /* Buttons */
    .toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .toggle-btn:active { transform: scale(0.97); }
    .toggle-btn:disabled { opacity: 0.5; cursor: default; }
    .toggle-btn.on  { background: #22c55e; color: white; }
    .toggle-btn.off { background: #ef4444; color: white; }
    .toggle-btn:not(:disabled):hover { opacity: 0.88; }

    .refresh-btn {
      width: 100%;
      padding: 8px;
      border: 1px solid #2d2d4e;
      border-radius: 8px;
      background: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .refresh-btn:hover { border-color: #6366f1; color: #a5b4fc; }
    .refresh-btn:active { transform: scale(0.97); }

    .refresh-icon {
      display: inline-block;
      transition: transform 0.4s ease;
    }
    .refresh-icon.spinning { transform: rotate(360deg); }

    .status-sub {
      font-size: 11px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="shield" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"
            fill="#6366f1"/>
    </svg>
    <span class="title">Joep's Adblocker</span>
  </div>

  <div class="body">

    <div class="indicator">
      <div class="dot" id="dot"></div>
      <span id="status-label">Laden...</span>
    </div>

    <div class="counter-card">
      <div class="counter-left">
        <span class="counter-number" id="counter">—</span>
        <span class="counter-label">advertenties geblokkeerd</span>
      </div>
    </div>

    <button class="toggle-btn" id="toggle-btn">Laden...</button>

    <button class="refresh-btn" id="refresh-btn">
      <span class="refresh-icon" id="refresh-icon">↻</span>
      Pagina verversen
    </button>

    <span class="status-sub" id="status-sub"></span>

  </div>

  <script src="popup.js"></script>
</body>
</html>
